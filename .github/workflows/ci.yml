name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libpulse-dev libdbus-1-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Release packages (no ROM inside): on version tags and by hand. Linux builds on
  # the oldest supported Ubuntu so the AppImage runs on older distributions too.
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev libpulse-dev libdbus-1-dev
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S . -B build $GEN -DCMAKE_BUILD_TYPE=Release -DGORF_BUILD_TESTS=OFF \
            -DBB_SOURCE_URL="${{ github.server_url }}/${{ github.repository }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          (cd build && cpack -C Release)
          if [ "$RUNNER_OS" = "Linux" ]; then
            APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL="$PWD/appimagetool" \
              external/breadbin-6502/packaging/linux/make-appimage.sh build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gorf-packages-${{ matrix.os }}
          path: |
            build/*.zip
            build/*.tar.gz
            build/*.AppImage
